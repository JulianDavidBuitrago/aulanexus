      }

      .auth-side {
        padding: 12px 16px 40px;
        align-items: start;
      }

      .review-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .grade-box {
        position: static;
      }
    }

    @media (max-width: 720px) {
      body {
        font-size: 14.5px;
      }

      .topbar {
        padding: 10px 16px;
        gap: 8px;
      }

      .crumb h1 {
        font-size: 17px;
      }

      .crumb small {
        display: none;
      }

      .demo-pill span {
        display: none;
      }

      .view {
        padding: 16px 16px calc(96px + env(safe-area-inset-bottom));
      }

      .stack {
        gap: 16px;
      }

      .hero {
        padding: 22px;
        border-radius: 22px;
      }

      .hero-orb {
        display: none;
      }

      .hero-actions,
      .hero-actions .btn {
        width: 100%;
      }

      .stats {
        gap: 12px;
      }

      .stat {
        padding: 14px;
        border-radius: 16px;
      }

      .stat .st-ic {
        width: 34px;
        height: 34px;
        margin-bottom: 10px;
      }

      .stat .st-val {
        font-size: 24px;
      }

      .stat .st-label {
        font-size: 12px;
      }

      .panel {
        padding: 16px;
        border-radius: 20px;
      }

      .class-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      .form-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .post {
        padding: 16px;
      }

      .auth-card {
        padding: 24px 20px;
        border-radius: 22px;
      }

      .auth-hero .features {
        display: none;
      }

      .auth-hero .lead {
        font-size: 15px;
        margin-top: 10px;
      }

      .stepper .step span {
        display: none;
      }

      .pw-checks {
        grid-template-columns: minmax(0, 1fr);
      }

      .modal-backdrop {
        padding: 0;
        place-items: end center;
      }

      .modal,
      .modal.lg,
      .modal.xl {
        width: 100%;
        max-height: 94dvh;
        border-radius: 24px 24px 0 0;
        animation: sheetIn .4s var(--ease);
      }

      .modal-head,
      .modal-body,
      .modal-foot {
        padding-left: 18px;
        padding-right: 18px;
      }

      .modal-foot .btn {
        flex: 1;
      }

      .toolbar select.input {
        width: 100%;
      }

      #toasts {
        right: 16px;
        left: 16px;
        width: auto;
        bottom: calc(84px + env(safe-area-inset-bottom));
      }

      /* Tablas → tarjetas */
      .tbl.cards thead {
        display: none;
      }

      .tbl.cards,
      .tbl.cards tbody,
      .tbl.cards tr,
      .tbl.cards td {
        display: block;
        width: 100%;
      }

      .tbl.cards tr {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .tbl.cards td {
        border: 0;
        padding: 4px 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        text-align: right;
      }

      .tbl.cards td::before {
        content: attr(data-label);
        font-size: 11px;
        font-family: var(--mono);
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: .05em;
        text-align: left;
      }

      .tbl.cards td.who-cell {
        display: block;
        text-align: left;
        padding-bottom: 8px;
      }

      .tbl.cards td.who-cell::before {
        display: none;
      }

      .tbl.cards td.actions-cell::before {
        display: none;
      }

      .tbl.cards td.actions-cell .actions {
        width: 100%;
        justify-content: flex-start;
        padding-top: 6px;
      }

      .bottom-nav {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
        z-index: 45;
        padding: 6px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
        border: 1px solid var(--border);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: var(--shadow-lg);
      }

      .bottom-nav a {
        display: grid;
        justify-items: center;
        gap: 3px;
        padding: 8px 2px;
        border-radius: 14px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        text-decoration: none;
        transition: all .2s;
      }

      .bottom-nav a .ic {
        width: 20px;
        height: 20px;
      }

      .bottom-nav a.active {
        color: var(--text);
        background: var(--grad-soft);
      }

      .bottom-nav a.active .ic {
        color: var(--primary);
      }
    }

    @keyframes sheetIn {
      from {
        transform: translateY(100%);
      }

      to {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ---------- Ajustes de desbordamiento ---------- */
    .list,
    .sidebar-foot,
    .feed,
    .stack,
    .pick-list,
    .file-list {
      grid-template-columns: minmax(0, 1fr);
    }

    .row-item {
      min-width: 0;
    }

    .row-item .badge {
      flex: none;
    }

    .tbl td.num {
      white-space: nowrap;
    }

    .quick-grades button {
      min-width: 40px;
    }

    @media (max-width: 980px) {
      .sidebar {
        z-index: 60;
      }

      .scrim {
        z-index: 55;
      }
    }
